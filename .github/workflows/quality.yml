name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  php-syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: php tests/php-lint.php

  quality:
    name: PHP ${{ matrix.php }} / WordPress ${{ matrix.wordpress }} quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            wordpress: '6.3'
          - php: '8.3'
            wordpress: 'trunk'
          - php: '8.5'
            wordpress: 'trunk'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- assets/js/wp7-admin.js assets/js/wp7-admin.asset.php assets/js/wp7-admin.css assets/js/wp7-admin-rtl.css assets/js/wp7-dataviews.css assets/js/wp7-dataviews-rtl.css
      - run: composer install --no-interaction --prefer-dist
      - run: composer phpcs

      # The content filters run on WordPress's HTML API. Fetch just that part of
      # core so those tests execute instead of skipping.
      - name: Fetch the WordPress HTML API
        env:
          WP_CORE_REF: ${{ matrix.wordpress }}
        run: |
          git clone --depth=1 --filter=blob:none --sparse --branch "$WP_CORE_REF" https://github.com/WordPress/wordpress-develop.git /tmp/wordpress
          git -C /tmp/wordpress sparse-checkout set src/wp-includes
      - run: composer test
        env:
          FUNCTIONALITIES_WP_DIR: /tmp/wordpress/src

      - name: Translation template is current
        run: ./bin/make-pot.sh --check
      - run: |
          for file in $(find assets -name '*.js' -type f); do
            node --check "$file"
          done
      - run: bash -n build.sh
      - run: bash -n bin/make-pot.sh
      - run: bash -n bin/extract-changelog.sh

  package:
    name: Distribution package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - run: |
          version=$(grep -m1 'Version:' functionalities.php | awk '{print $NF}')
          zip="functionalities-${version}.zip"
          test -s "$zip"
          unzip -t "$zip"
          for required in \
            functionalities/includes/admin/class-admin-icons.php \
            functionalities/assets/brand/functionalities.svg \
            functionalities/assets/brand/functionalities-admin.svg \
            functionalities/assets/css/admin-brand.css \
            functionalities/assets/css/admin-icons.css \
            functionalities/assets/css/admin-polish.css \
            functionalities/assets/js/admin-polish.js \
            functionalities/assets/js/admin-link-health.js \
            functionalities/assets/js/admin-link-health-editor.js \
            functionalities/includes/features/class-link-health-editor.php \
            functionalities/includes/features/class-link-health-report.php \
            functionalities/assets/icons/settings.svg \
            functionalities/assets/icons/arrow-left.svg \
            functionalities/assets/icons/LICENSE \
            functionalities/includes/features/class-content-tools.php \
            functionalities/includes/features/class-link-health.php \
            functionalities/includes/features/class-site-activity.php \
            functionalities/includes/admin/trait-admin-utilities-ui.php \
            functionalities/includes/admin/class-link-health-controller.php \
            functionalities/includes/admin/class-site-activity-controller.php \
            functionalities/functionalities.php \
            functionalities/readme.txt \
            functionalities/uninstall.php \
            functionalities/includes/admin/class-admin.php \
            functionalities/includes/admin/class-module-controller.php \
            functionalities/includes/admin/class-settings-portability-controller.php \
            functionalities/includes/admin/class-site-health-controller.php \
            functionalities/includes/core/class-module-registry.php \
            functionalities/includes/admin/trait-admin-settings.php \
            functionalities/includes/admin/trait-admin-components-ui.php \
            functionalities/includes/admin/trait-admin-fonts-ui.php \
            functionalities/includes/admin/trait-admin-task-manager-ui.php \
            functionalities/includes/admin/trait-admin-redirect-manager-ui.php \
            functionalities/includes/admin/trait-admin-svg-icons-ui.php \
            functionalities/includes/admin/trait-admin-snippets-ui.php \
            functionalities/includes/admin/trait-admin-pwa-ui.php \
            functionalities/includes/core/class-wordpress-7-integration.php \
            functionalities/includes/storage/class-atomic-json-store.php \
            functionalities/includes/storage/class-data-directory.php \
            functionalities/assets/vendor/prism/prism.min.js \
            functionalities/assets/vendor/prism/prism.min.css \
            functionalities/languages/functionalities.pot \
            functionalities/assets/js/admin-redirects.js \
            functionalities/assets/js/admin-tools.js \
            functionalities/assets/js/wp7-admin.js \
            functionalities/assets/js/wp7-admin.asset.php \
            functionalities/assets/js/wp7-admin.css \
            functionalities/assets/js/wp7-commands.js \
            functionalities/assets/js/wp7-dataviews.css \
            functionalities/assets/blocks/svg-icon/block.json; do
            unzip -Z1 "$zip" | grep -qx "$required"
          done
          if unzip -Z1 "$zip" | grep -Eq '(^|/)(tests|node_modules|src|docs|\.git|\.github)/|/vendor/(composer|bin)/|composer\.(json|lock)$|package\.json$|\.md$'; then
            echo 'Development files leaked into the distribution.' >&2
            exit 1
          fi
