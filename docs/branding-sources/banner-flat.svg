  <text x="64" y="213" font-family="Really Sans Large, sans-serif" font-size="68" font-weight="800" fill="#ffffff">Dynamic</text>
  <text x="64" y="286" font-family="Really Sans Large, sans-serif" font-size="68" font-weight="800" fill="#ffffff">Functionalities</text>
  <text x="64" y="342" font-family="Finlandica Text, sans-serif" font-size="32" font-weight="400" fill="#d3e4ee">Enable only what you need.</text>
