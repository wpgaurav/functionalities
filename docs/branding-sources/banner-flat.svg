<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" role="img" aria-labelledby="art-title art-desc">
  <title id="art-title">Dynamic Functionalities: a modular WordPress toolkit</title>
  <desc id="art-desc">A colorful bento banner with the Functionalities platform mark, 19 optional modules, and tiles for Content Tools, Link Health, reusable fonts and styles, and Site Activity. Free and open source.</desc>
